# Decap CMS configuration: https://decapcms.org/docs/configuration-options/
# Only blog articles and prompts are managed here. Everything else lives in src/data/site.ts.

backend:
  name: github
  repo: jayrathod3210/jayrathodportfoliowebsite
  branch: main
  # Login uses Netlify's free GitHub OAuth provider (https://api.netlify.com). See docs/CMS_SETUP.md.

# Edit locally without GitHub: run `npx decap-server` next to `npm run dev`,
# then open http://localhost:5173/admin/index.html. Ignored on the live site.
local_backend: true

site_url: https://jayrathodportfoliowebsite.netlify.app

media_folder: public/images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: blog
    label: Blog articles
    label_singular: Article
    description: Articles are hidden from the site until Status is set to Published.
    folder: content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{status}}"
    sortable_fields: [title, publishedAt]
    preview_path: "blog/{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - label: Excerpt
        name: excerpt
        widget: text
        hint: One or two sentences shown on article cards and in search results.
        pattern: ['^[\s\S]{20,300}$', "Write between 20 and 300 characters."]
      - label: Status
        name: status
        widget: select
        default: draft
        options:
          - { label: "Draft (hidden from the site)", value: draft }
          - { label: Published, value: published }
      - label: Publish date
        name: publishedAt
        widget: datetime
        required: false
        default: ""
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        hint: Set this to the day you publish. Leave empty for drafts.
      - { label: Featured, name: featured, widget: boolean, default: false, hint: Shown at the top of the blog page. }
      - label: Category
        name: category
        widget: select
        options:
          - { label: Software Testing, value: software-testing }
          - { label: Manual Testing, value: manual-testing }
          - { label: Automation Testing, value: automation-testing }
          - { label: API Testing, value: api-testing }
          - { label: Playwright, value: playwright }
          - { label: Cypress, value: cypress }
          - { label: Selenium, value: selenium }
          - { label: AI in QA, value: ai-in-qa }
          - { label: Test Strategy, value: test-strategy }
          - { label: Software Quality, value: software-quality }
          - { label: QA Career, value: qa-career }
      - { label: Tags, name: tags, widget: list, default: [], hint: "Lowercase, e.g. playwright, api testing" }
      - { label: Cover image, name: coverImage, widget: image, required: false }
      - { label: Cover image description (alt text), name: coverAlt, widget: string, required: false, hint: Describe the image for screen readers. }
      - label: Article
        name: body
        widget: markdown
        hint: Use "Heading 2" and "Heading 3" for sections. Three or more headings create a table of contents.

  - name: prompts
    label: QA prompts
    label_singular: Prompt
    description: Prompts appear in the QA Prompt Library when Status is Published.
    folder: content/prompts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{status}}"
    sortable_fields: [title]
    preview_path: "prompts/{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Short description, name: description, widget: text }
      - label: Category
        name: category
        widget: select
        options:
          - { label: Test Case Generation, value: test-case-generation }
          - { label: Manual Testing, value: manual-testing }
          - { label: API Testing, value: api-testing }
          - { label: Automation Testing, value: automation-testing }
          - { label: Playwright, value: playwright }
          - { label: Cypress, value: cypress }
          - { label: Bug Analysis, value: bug-analysis }
          - { label: Test Data Generation, value: test-data-generation }
          - { label: Test Documentation, value: test-documentation }
          - { label: AI in QA, value: ai-in-qa }
      - label: Status
        name: status
        widget: select
        default: published
        options:
          - { label: Published, value: published }
          - { label: "Unpublished (hidden from the site)", value: draft }
      - { label: Featured, name: featured, widget: boolean, default: false, hint: Featured prompts appear on the home page. }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Usage notes, name: usageNotes, widget: text, required: false, hint: Optional tips shown under the prompt. }
      - label: Prompt text
        name: body
        widget: text
        hint: "Exactly what the Copy Prompt button copies. Use {{placeholders}} for values the reader should replace."
