heroTitle: I Turn Testing Into Quality Engineering.
heroSubtitle: QA professional with {years} years of experience across manual testing, web, mobile, desktop and game applications, automation, performance and API testing. Exploring smarter ways to improve software quality through automation and AI.
careerStart: 2021-04
shortIntro: I started my career in manual testing and grew into automation and quality engineering. Today I focus on Playwright with TypeScript, API testing, and practical ways AI can make QA teams faster and sharper.
about: |-
  I began my career as a manual tester, working hands-on with web applications, mobile applications and early API checks. Those first two years taught me the fundamentals that still shape how I work: functional and regression testing, reading requirements closely, and thinking about how real users will actually break a product.

  Over the next two years my focus moved to web application testing and automation. I built automation with **Cypress**, worked with **Selenium**, and learned how a good automation suite changes the speed and confidence of a release.

  Today I work with **Playwright and TypeScript**, test APIs with **Postman** and **Swagger**, manage work in **Jira**, and explore how **AI-assisted testing** can improve QA productivity: generating test ideas, triaging failures and reviewing coverage.

  What connects all of it is a simple belief: testing is not a phase at the end of development. It is a way of understanding the product and protecting the people who use it.
philosophy: Testing is not just about executing test cases. It is about understanding the product, identifying risks, challenging assumptions, and ensuring software quality.
